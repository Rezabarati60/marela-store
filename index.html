<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فروشگاه مارلا</title>
<meta name="theme-color" content="#FBE3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مارلا">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, soft pink paper, rose accent, navy ink from the Marela logo.
   Brand hero on the home page, compact bar elsewhere, fixed tab bar at the bottom. */
:root{
  color-scheme:light;
  --bg:#FFF3F6; --surface:#FFFFFF; --ink:#2F2230; --muted:#86697A; --line:#F2D8E1; --chip:#FCE5EC;
  --accent:#C4466F; --accent-ink:#FFFFFF; --accent-bg:#FBDCE6; --accent-soft:#FDEEF3;
  --navy:#1E3A5F; --teal:#4B8F9E; --gold:#C39653;
  --pos:#1F7A63; --pos-bg:#DDF1EA; --neg:#B3261E; --neg-bg:#FDE3E0; --warn:#8A5A00; --warn-bg:#FBEBC8;
  --font:"Vazirmatn","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --brand:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:600px;margin:0 auto}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
h2{font-size:21px;margin:18px 0 8px;font-weight:800;text-wrap:balance}
h3{font-size:16px;margin:20px 0 8px;font-weight:700;color:var(--navy)}
.note{color:var(--muted);font-size:13px;margin:4px 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* brand hero (home) */
.brand{display:flex;align-items:center;gap:14px;padding:14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:22px}
.brand img{width:72px;height:72px;border-radius:50%;flex:none;border:1px solid var(--line)}
.brand .nm{font-family:var(--brand);font-weight:600;font-size:34px;letter-spacing:.1em;color:var(--navy);line-height:1;direction:ltr;text-align:right}
.brand .sb{font-size:14px;color:var(--accent);font-weight:700;margin-top:6px}
.brand .ow{font-size:12.5px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.bar h1{flex:1;margin:0;font-size:20px;font-weight:800;color:var(--navy)}
.bar img{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--navy)}
.iconbtn svg{width:22px;height:22px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.tile span{display:block;font-size:12.5px;color:var(--muted)}
.tile b{display:block;font-size:19px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.tile small{display:block;font-size:11.5px;color:var(--muted)}
.tile.rose{background:var(--accent-soft);border-color:#F6C9D8}
.tile.pos b{color:var(--pos)} .tile.neg b{color:var(--neg)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font-size:28px;font-weight:800;color:var(--navy);margin:2px 0}
.hero .big small{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:6px}

/* lists */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:right;min-height:58px}
.row:last-child{border-bottom:0}
button.row:active{background:var(--accent-soft)}
.row .r1{flex:1;min-width:0;display:block}
.row .r1 .d{display:block;font-weight:700;overflow-wrap:anywhere}
.row .r1 .m{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .r2{text-align:left;flex:none;max-width:48%}
.row .amt{display:block;font-weight:800}
.row .bal{display:block;font-size:12px;color:var(--muted)}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--chip);color:var(--navy);margin-inline-start:6px;vertical-align:middle}
.tag.ok{background:var(--pos-bg);color:var(--pos)} .tag.late{background:var(--neg-bg);color:var(--neg)} .tag.wait{background:var(--warn-bg);color:var(--warn)} .tag.anon{background:#E6EEF8;color:var(--navy)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed #EFC3D2;border-radius:16px;background:var(--surface);margin:8px 0}

/* controls */
.btn{display:block;width:100%;min-height:48px;padding:10px 16px;margin-top:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--navy)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-bg);border-color:#F3BDD0;color:#8E2149}
.btn.danger{background:var(--neg-bg);border-color:#F3B9B3;color:var(--neg)}
.btn.sm{display:inline-block;width:auto;min-height:40px;margin:6px 0 0;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.5}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns2 .btn{margin-top:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin:6px 0}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;font-size:14px;font-weight:600;color:var(--muted);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lab{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-size:14px;font-weight:600;color:var(--navy)}
.lab label{font-weight:600}
.field{width:100%;min-height:48px;padding:9px 13px;border:1px solid #EBCBD6;border-radius:13px;background:#fff;color:var(--ink);text-align:right}
.field.ltr{direction:ltr;text-align:left}
textarea.field{min-height:76px;resize:vertical}
.tmn{font-size:12.5px;color:var(--muted);margin:3px 4px 0;min-height:19px}
.tmn b{color:var(--navy)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:10px 0}
.box.pad{padding:12px 14px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:13.5px;margin:10px 0}
.banner.rose{background:var(--accent-bg);color:#8E2149}
.banner.bad{background:var(--neg-bg);color:var(--neg)}
.banner button{margin-inline-start:6px}
.err{min-height:0;color:var(--neg);font-size:13.5px;font-weight:600;margin-top:10px}
.errbox{padding:10px 14px;border-radius:12px;background:var(--neg-bg);font-weight:700;font-size:14.5px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14.5px}

/* invoice lines in forms */
.ln{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:10px 0;position:relative}
.ln .x{position:absolute;left:8px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--neg);font-size:18px;line-height:1}
.ln .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ln .stk{font-size:12.5px;color:var(--muted);margin:2px 2px 0}
.ln .sum{font-weight:800;color:var(--navy);margin-top:6px}
.codebadge{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid #F6C9D8;border-radius:16px;padding:10px 14px;margin:8px 0}
.codebadge b{font-size:22px;letter-spacing:.06em;color:#8E2149;direction:ltr}
.codebadge span{font-size:13px;color:var(--muted)}
.totbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin:12px 0}
.totbox div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.totbox div:last-child{border-bottom:0}
.totbox .gt{font-size:18px;font-weight:800;color:var(--navy)}
.totbox .w{display:block;font-size:12.5px;color:var(--muted);border-bottom:0}
.inst{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.inst i{font-style:normal;color:var(--muted);text-align:center}

/* charts */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;margin:10px 0}
.chart canvas{display:block;width:100%;height:auto}
.chart .cap{font-size:13px;color:var(--muted);min-height:20px;margin:2px 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 4px 2px;font-size:13px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* bottom tabs */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;color:var(--muted);font-size:11.5px;font-weight:600;min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button.fab{color:var(--accent-ink)}
.nav button.fab span.pl{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--accent);margin-top:-18px;border:4px solid var(--surface)}
.nav button.fab svg{width:24px;height:24px}
.nav button.fab small{color:var(--accent);font-size:11.5px;font-weight:700}

/* modal, toast */
.modal{position:fixed;inset:0;z-index:40;background:rgba(40,16,30,.5);display:flex;align-items:center;justify-content:center;padding:14px}
.modal[hidden]{display:none}
.mbox{width:100%;max-width:470px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px;padding:16px;border:1px solid var(--line)}
.mbox h3{margin:0 0 8px;font-size:18px}
.mline{padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.8}
.mline b{color:#8E2149}
.mwarn{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:13.5px}
.pv{display:grid;gap:8px;margin:8px 0}
.pv img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:360px){.tiles{grid-template-columns:1fr}.brand .nm{font-size:32px}}
</style>
</head><body><div class="wrap">

</div>

function calc(){

  var byCust={};S.sales.forEach(function(s){(byCust[s.cust]=byCust[s.cust]||[]).push(s)});
  var today=todayJ();
  function saleSum(s){var t=0;s.lines.forEach(function(l){t+=l.q*l.price});return t}

}

function instParts(rem,n,first,gap){

  return out;
}

  S.sales.forEach(function(s){if(!inR(s.date,a,b))return;var st=saleSt(s.id);o.cnt++;o.sales+=st.total;o.net+=st.net;o.ship+=(s.ship||0);o.qty+=saleQty(s);o.cogs+=st.cogs-st.retCogs;o.profit+=st.profit+(s.ship||0)});
  S.rets.forEach(function(r){if(inR(r.date,a,b))o.ret+=r.credit||0});
  var C=calc();
  S.buys.forEach(function(x){if(inR(x.date,a,b))o.buys+=C.buyTotal[x.id]||0});
  S.exps.forEach(function(x){if(inR(x.date,a,b))o.exps+=x.amt});
  S.adjs.forEach(function(x){if(inR(x.date,a,b))o.loss+=C.lossOf[x.id]||0});
  S.pays.forEach(function(p){if(!inR(p.date,a,b))return;var pp=party(p.party);if(!pp)return;if(pp.type==="cust")o.recv+=(p.dir==="in"?p.amt:-p.amt);else o.paidOut+=(p.dir==="out"?p.amt:-p.amt)});
  o.net_profit=o.profit-o.exps-o.loss;

}

function lineStats(a,b){
  /* per product: qty, revenue, cost in range, net of returns */
  var C=calc(),m={};
  function g(p){return m[p]||(m[p]={p:p,q:0,rev:0,cost:0})}
  S.sales.forEach(function(s){if(!inR(s.date,a,b))return;var items=0;s.lines.forEach(function(l){items+=l.q*l.price});var k=items?1-(s.disc||0)/items:1;
    s.lines.forEach(function(l){var o=g(l.p),u=C.unitCost[s.id+"|"+l.p]||0;o.q+=l.q;o.rev+=l.q*l.price*k;o.cost+=l.q*u})});
  S.rets.forEach(function(r){if(!inR(r.date,a,b))return;var s=by(S.sales,r.sale);if(!s)return;var items=0;s.lines.forEach(function(l){items+=l.q*l.price});var k=items?1-(s.disc||0)/items:1;
    r.lines.forEach(function(l){var o=g(l.p),u=C.unitCost[s.id+"|"+l.p]||0;o.q-=l.q;o.rev-=l.q*l.price*k;o.cost-=l.q*u})});

}

function drawRepChart(){
  var cv=$("rc"),c=repChart;if(!cv||!c)return;

  if(c.type==="hbars")h=c.items.length*64+6;else h=240;
  cv.style.width=w+"px";cv.style.height=h+"px";cv.width=w*dpr;cv.height=h*dpr;
  var ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  repHits=c.type==="hbars"?drawHBars(ctx,6,2,w-12,c.items,{color:c.color}):drawCols(ctx,2,2,w-4,h-4,c.cats,c.series);
}
function repTap(e){
  var cv=e.target;if(!cv||cv.id!=="rc"||!repHits||!repChart)return;
  var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,hit=null;
  repHits.forEach(function(k){if(x>=k.x&&x<=k.x+k.w&&y>=k.y&&y<=k.y+k.h)hit=k});

}
